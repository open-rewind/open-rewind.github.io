name: Publish website

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: open-rewind/rewind
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: website

      - id: source
        name: Check website revision
        shell: bash
        run: |
          revision=$(git log -1 --format=%H -- website/)
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            deployed=$(curl --fail --silent --show-error --retry 2 https://open-rewind.github.io/website-revision.txt) || deployed=''
            if [[ "$revision" == "$deployed" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - if: steps.source.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.source.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - if: steps.source.outputs.publish == 'true'
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          echo "${{ steps.source.outputs.revision }}" > out/website-revision.txt

      - if: steps.source.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
